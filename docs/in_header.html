<link rel="icon" href="images/odf_icon_transparent.ico" type="image/x-icon">

<script>
document.addEventListener("DOMContentLoaded", function () {
  const navbarBrand = document.querySelector(".navbar-brand");
  if (!navbarBrand || navbarBrand.querySelector(".odf-navbar-logo")) return;

  const icon = document.createElement("img");
  icon.src = "images/odf_icon_long_white2_higher_transparent.png";
  icon.alt = "Open Data Format";
  icon.className = "odf-navbar-logo";
  navbarBrand.prepend(icon);
});
</script>
